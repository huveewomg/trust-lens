<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trust Lens  — POC</title>
    <link rel="stylesheet" href="static/css/style.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Trust Lens — Proof of Concept</h1>
        <div class="sub">Paste a suspicious message, click an example to append, then Analyze. We'll score and highlight risky phrases.</div>
      </header>

      <div class="grid">
        <section class="card" aria-label="Input">
          <div class="head"><strong>Message</strong><span class="muted">Click examples to append</span></div>
          <div class="body">
            <div class="examples" id="examples"></div>
            <textarea id="message" placeholder="Paste the message here..." maxlength="500"></textarea>
            <div class="controls">
              <button id="analyzeBtn">Analyze</button>
              <button id="clearBtn" class="secondary">Clear</button>
              <span id="status" class="muted" aria-live="polite"></span>
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="score" aria-label="Risk score">
                <div class="meter"><div class="bar" id="bar"></div></div>
                <div class="num" id="score">Score: 0</div>
              </div>
              <div class="annotated" id="annotated" aria-label="Annotated message">Highlighted results will appear here…</div>
            </div>
          </div>
        </section>

        <aside class="card" aria-label="Explanation">
          <div class="head"><strong>Why this looks risky</strong></div>
          <div class="body">
            <ul class="explain" id="explain">
              <li>Run an analysis to see findings.</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>

    <script src="static/js/script.js"></script>
  </body>
</html>
